[package]
name = "rbxyoinker"
version = "0.3.3"
edition = "2021"
description = "Local Roblox asset downloader with a web UI"
authors = ["3vil17"]
license = "AGPL-3.0-only"
repository = "https://github.com/3vil17/rbxyoinker"

[build-dependencies]
winresource = "0.1"

[dependencies]
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "gzip", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
dirs = "7"
thiserror = "2"
open = "5"
rfd = "0.17"
zip = { version = "9", default-features = false, features = ["deflate"] }
lz4_flex = "0.11"
zstd = "0.13"
getrandom = "0.2"
minisign-verify = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
minisign = "0.10"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
